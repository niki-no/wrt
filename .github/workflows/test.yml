name: test

on:
  workflow_dispatch:
    inputs:
      REPO:
        description: '选择仓库'
        default: 'lede'
        type: choice
        options: ['lede', 'immortalwrt', 'openwrt']
      ARCH:
        description: '输入架构 (例如: x86-64,ac58u)'
        default: ''
        type: string
        
  #schedule:
  #  - cron: "5 19 * * *"
  watch:
    types: started

permissions: write-all

env:
  GITHUB_TOKEN: ${{secrets.REPO_TOKEN}}

jobs:
  matrix:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    
    steps:
      - name: 检出代码
        uses: actions/checkout@main

      - name: 构建矩阵
        id: set-matrix
        run: |
          FIRMWARE_ARRAY=()
          ARCH_INPUT="${{ github.event.inputs.ARCH }}"
          REPO_SELECTED="${{ github.event.inputs.REPO }}"
          DEFAULT_REPO="lede"
          REPO_USED="${REPO_SELECTED:-$DEFAULT_REPO}"
          HAS_ARCH_INPUT=false

          if [[ -n "$ARCH_INPUT" ]]; then
            HAS_ARCH_INPUT=true
            IFS=',; ' read -ra input_parts <<< "$ARCH_INPUT"
            for part in "${input_parts[@]}"; do
              clean_part=$(echo "$part" | xargs)
              [[ -z "$clean_part" ]] && continue              
              if [[ "$clean_part" =~ ^(lede|immortalwrt|openwrt) ]]; then
                new_target="$clean_part"
              else
                new_target="${REPO_USED}-${clean_part}"
              fi
              FIRMWARE_ARRAY+=("$new_target")
            done
          fi

          if [[ "$HAS_ARCH_INPUT" == false ]] && [[ -f "Build-OpenWrt" && -s "Build-OpenWrt" ]]; then
            while IFS= read -r line; do
              [[ "$line" =~ ^[[:space:]]*# || -z "${line// }" ]] && continue
              IFS=',; ' read -ra parts <<< "$line"
              for part in "${parts[@]}"; do
                clean_part=$(echo "$part" | xargs)
                [[ -z "$clean_part" ]] && continue                
                if [[ "$clean_part" =~ ^(lede|immortalwrt|openwrt) ]]; then
                  new_target="$clean_part"
                else
                  new_target="${REPO_USED}-${clean_part}"
                fi
                FIRMWARE_ARRAY+=("$new_target")
              done
            done < Build-OpenWrt
          fi

          if [[ ${#FIRMWARE_ARRAY[@]} -eq 0 ]]; then
            echo "::error::错误：未找到有效的构建目标"
            exit 1
          fi

          FIRMWARE_ARRAY=($(printf "%s\n" "${FIRMWARE_ARRAY[@]}" | sort -u))
          targets_json=$(jq -c -n --argjson arr "$(printf '%s\n' "${FIRMWARE_ARRAY[@]}" | jq -R . | jq -s .)" '$arr')
          echo "matrix=$targets_json" >> $GITHUB_OUTPUT

  build:
    name: 构建 ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: matrix
    strategy:
      matrix:
        target: ${{ fromJson(needs.matrix.outputs.matrix) }}
      fail-fast: false
    
    steps:
      - name: 检出代码
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: 配置变量
        run: |
          echo "REPO_NAME=$(basename "${{ matrix.target }}" | awk -F'-' '{print $1}')" >> $GITHUB_ENV
          echo "ARCH_NAME=$(basename "${{ matrix.target }}" | sed -E 's/^[^-]*-//')" >> $GITHUB_ENV
          echo "date=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_ENV

      - name: 加载配置
        run: |
          source "${GITHUB_WORKSPACE}/scripts/settings.ini"
          if [ -f "${GITHUB_WORKSPACE}/${{ env.ARCH_NAME }}/settings.ini" ]; then
            source "${GITHUB_WORKSPACE}/${{ env.ARCH_NAME }}/settings.ini"
          fi
          echo "REPO_URL=${REPO_URL}" >> $GITHUB_ENV
          echo "REPO_BRANCH=${REPO_BRANCH}" >> $GITHUB_ENV
          echo "CONFIG_FILE=${CONFIG_FILE}" >> $GITHUB_ENV
          echo "CUSTOM_SH=${CUSTOM_SH}" >> $GITHUB_ENV
          echo "COMMON_SH=${COMMON_SH}" >> $GITHUB_ENV
          echo "ADDON_SH=${ADDON_SH}" >> $GITHUB_ENV
          echo "UPLOAD_FIRMWARE_FOR_ARTIFACT=${UPLOAD_FIRMWARE_FOR_ARTIFACT}" >> $GITHUB_ENV
          echo "UPLOAD_EFI_FIRMWARE_FOR_ARTIFACT=${UPLOAD_EFI_FIRMWARE_FOR_ARTIFACT}" >> $GITHUB_ENV
          echo "UPLOAD_FIRMWARE_FOR_RELEASE=${UPLOAD_FIRMWARE_FOR_RELEASE}" >> $GITHUB_ENV

      - name: 克隆代码
        run: |
          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/OpenWrt
          
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH OpenWrt
          mkdir -p OpenWrt/wrt && cp -rf ${{ env.ARCH_NAME }} scripts config.diff OpenWrt/wrt/
          cd OpenWrt && ls -a

      - name: 应用配置
        run: |
          cd OpenWrt
          [ -d "wrt/scripts/files" ] && cp -Rf wrt/scripts/files/${{ env.REPO_NAME }} files || true
          [ -d "wrt/scripts/diy-files" ] && cp -Rf wrt/scripts/diy-files/${{ env.REPO_NAME }}/* ./ || true
          if [ -f "wrt/scripts/$COMMON_SH" ]; then
            chmod +x wrt/scripts/$COMMON_SH
            /bin/bash "wrt/scripts/$COMMON_SH"
          fi
          if [ -f "wrt/${{ env.ARCH_NAME }}/$CUSTOM_SH" ]; then
            chmod +x wrt/${{ env.ARCH_NAME }}/$CUSTOM_SH
            /bin/bash "wrt/${{ env.ARCH_NAME }}/$CUSTOM_SH"
          fi
          mv wrt/config.diff/${{ env.REPO_NAME }} .config
          if [ -f "wrt/${{ env.ARCH_NAME }}/$CONFIG_FILE" ]; then
            echo >> .config
            cat wrt/${{ env.ARCH_NAME }}/$CONFIG_FILE >> .config
          fi
          ls -a wrt 
          cat package\base-files\files\etc\banner
